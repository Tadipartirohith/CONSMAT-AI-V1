name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - inventory-service
          - site-service
          - pricing-service
          - procurement-service
          - payment-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        # Tests run against in-memory SQLite, so no Postgres service is needed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  frontend-build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - hub-console
          - spoke-app
          - consumer-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install and build
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install --no-audit --no-fund
          npm run build

  docker-build:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v7
      - name: Build all service + frontend images
        working-directory: infra
        # Validates every Dockerfile + dependency install (uses compose defaults; no secrets needed).
        run: docker compose build
