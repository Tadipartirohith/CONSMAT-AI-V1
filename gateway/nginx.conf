# Consmat AI V1 — API gateway.
# Single ingress in front of every backend microservice. Each service is exposed under a stable
# /api/<service>/ prefix (mapped to that service's /api/v1). All frontend API traffic flows through
# here, and external/programmatic clients get one base URL. Central CORS lives here too.

upstream identity     { server identity-service:8000; }
upstream inventory    { server inventory-service:8000; }
upstream procurement  { server procurement-service:8000; }
upstream site         { server site-service:8000; }
upstream pricing      { server pricing-service:8000; }
upstream payment      { server payment-service:8000; }

server {
    listen 80;
    server_name _;

    # Forwarded headers for every upstream (inherited by all locations).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Gateway consmat-gateway;
    proxy_read_timeout 60s;

    # Central CORS (for external/cross-origin API clients; same-origin frontends don't need it).
    add_header Access-Control-Allow-Origin  $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Credentials "true" always;
    if ($request_method = OPTIONS) { return 204; }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location = / {
        default_type application/json;
        return 200 '{"service":"consmat-gateway","routes":["/api/identity","/api/inventory","/api/procurement","/api/site","/api/pricing","/api/payment"]}';
    }

    location /api/identity/    { proxy_pass http://identity/api/v1/; }
    location /api/inventory/   { proxy_pass http://inventory/api/v1/; }
    location /api/procurement/ { proxy_pass http://procurement/api/v1/; }
    location /api/site/        { proxy_pass http://site/api/v1/; }
    location /api/pricing/     { proxy_pass http://pricing/api/v1/; }
    location /api/payment/     { proxy_pass http://payment/api/v1/; }
}
