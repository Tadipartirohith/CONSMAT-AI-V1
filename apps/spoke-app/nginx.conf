server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Path-proxy to the services this app uses (mapped to /api/v1), same-origin.
    location /site/ { proxy_pass http://site-service:8000/api/v1/; }
    location /inv/  { proxy_pass http://inventory-service:8000/api/v1/; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
