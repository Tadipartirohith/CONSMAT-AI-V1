server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Path-proxy (same-origin): identity for login, site-service for project data.
    location /id/   { proxy_pass http://identity-service:8000/api/v1/; }
    location /site/ { proxy_pass http://site-service:8000/api/v1/; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
