server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API traffic flows through the gateway (single ingress), same-origin.
    location /id/    { proxy_pass http://gateway/api/identity/; }
    location /site/  { proxy_pass http://gateway/api/site/; }
    location /price/ { proxy_pass http://gateway/api/pricing/; }
    location /pay/   { proxy_pass http://gateway/api/payment/; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
