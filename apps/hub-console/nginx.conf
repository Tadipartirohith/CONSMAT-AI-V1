server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # All API traffic flows through the gateway (single ingress), keeping the browser same-origin.
    location /id/    { proxy_pass http://gateway/api/identity/; }
    location /inv/   { proxy_pass http://gateway/api/inventory/; }
    location /proc/  { proxy_pass http://gateway/api/procurement/; }
    location /site/  { proxy_pass http://gateway/api/site/; }
    location /price/ { proxy_pass http://gateway/api/pricing/; }
    location /pay/   { proxy_pass http://gateway/api/payment/; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
