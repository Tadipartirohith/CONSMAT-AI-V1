server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Path-proxy to each hub service (maps to its /api/v1), keeping the browser same-origin.
    location /inv/   { proxy_pass http://inventory-service:8000/api/v1/; }
    location /proc/  { proxy_pass http://procurement-service:8000/api/v1/; }
    location /site/  { proxy_pass http://site-service:8000/api/v1/; }
    location /price/ { proxy_pass http://pricing-service:8000/api/v1/; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
