# Consmat AI V1 — local dev stack.
# Starts with the inventory-service (Step 2). Further services are added as they are built.
services:
  db:
    image: postgres:16-alpine
    container_name: consmat-v1-db
    environment:
      POSTGRES_USER: consmat
      POSTGRES_PASSWORD: consmat
      POSTGRES_DB: inventory
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consmat -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  inventory-service:
    build: ../services/inventory-service
    container_name: consmat-v1-inventory
    environment:
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/inventory
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
    ports:
      - "${INVENTORY_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  procurement-service:
    build: ../services/procurement-service
    container_name: consmat-v1-procurement
    environment:
      # own logical database on the shared server (D10); entrypoint self-creates it
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/procurement
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      INVENTORY_URL: http://inventory-service:8000
      PRICING_URL: http://pricing-service:8000
      # Hub LLM (procurement intelligence) — stub unless configured in .env
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    ports:
      - "${PROCUREMENT_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  site-service:
    build: ../services/site-service
    container_name: consmat-v1-site
    environment:
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/site
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      INVENTORY_URL: http://inventory-service:8000
    ports:
      - "${SITE_PORT:-8003}:8000"
    depends_on:
      db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    restart: unless-stopped

  pricing-service:
    build: ../services/pricing-service
    container_name: consmat-v1-pricing
    environment:
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/pricing
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      INVENTORY_URL: http://inventory-service:8000
      DEFAULT_MARGIN_PCT: ${DEFAULT_MARGIN_PCT:-10}
    ports:
      - "${PRICING_PORT:-8004}:8000"
    depends_on:
      db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
