# Consmat AI V1, local dev stack.
# Starts with the inventory-service (Step 2). Further services are added as they are built.
services:
  db:
    image: postgres:16-alpine
    container_name: consmat-v1-db
    environment:
      POSTGRES_USER: consmat
      POSTGRES_PASSWORD: consmat
      POSTGRES_DB: inventory
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consmat -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  identity-service:
    build: ../services/identity-service
    container_name: consmat-v1-identity
    environment:
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/identity
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-consmat123}
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8005}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  inventory-service:
    build: ../services/inventory-service
    container_name: consmat-v1-inventory
    environment:
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/inventory
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  procurement-service:
    build: ../services/procurement-service
    container_name: consmat-v1-procurement
    environment:
      # own logical database on the shared server (D10); entrypoint self-creates it
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/procurement
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      INVENTORY_URL: http://inventory-service:8000
      PRICING_URL: http://pricing-service:8000
      # Hub LLM (procurement intelligence), stub unless configured in .env
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      SCOUT_PROVIDER: ${SCOUT_PROVIDER:-auto}
      # Live web price-scout search key (e.g. Tavily, free tier). Empty = fall back to LLM estimates.
      SCOUT_API_KEY: ${SCOUT_API_KEY:-}
    ports:
      - "127.0.0.1:${PROCUREMENT_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  site-service:
    build: ../services/site-service
    container_name: consmat-v1-site
    environment:
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/site
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      INVENTORY_URL: http://inventory-service:8000
    ports:
      - "127.0.0.1:${SITE_PORT:-8003}:8000"
    depends_on:
      db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    restart: unless-stopped

  pricing-service:
    build: ../services/pricing-service
    container_name: consmat-v1-pricing
    environment:
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/pricing
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      INVENTORY_URL: http://inventory-service:8000
      DEFAULT_MARGIN_PCT: ${DEFAULT_MARGIN_PCT:-10}
    ports:
      - "127.0.0.1:${PRICING_PORT:-8004}:8000"
    depends_on:
      db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build: ../services/payment-service
    container_name: consmat-v1-payment
    environment:
      DATABASE_URL: postgresql+psycopg://consmat:consmat@db:5432/payment
      API_PREFIX: /api/v1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      # Real-gateway secrets (only used if config.yaml selects that provider); blank by default.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYU_KEY: ${PAYU_KEY:-}
      PAYU_SALT: ${PAYU_SALT:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET: ${CASHFREE_SECRET:-}
    ports:
      - "127.0.0.1:${PAYMENT_PORT:-8006}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ../gateway
    container_name: consmat-v1-gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8088}:80"
    depends_on:
      - identity-service
      - inventory-service
      - procurement-service
      - site-service
      - pricing-service
      - payment-service
    restart: unless-stopped

  hub-console:
    build: ../apps/hub-console
    container_name: consmat-v1-hub-console
    ports:
      - "127.0.0.1:${HUB_CONSOLE_PORT:-8095}:80"
    depends_on:
      - gateway
    restart: unless-stopped

  spoke-app:
    build: ../apps/spoke-app
    container_name: consmat-v1-spoke-app
    ports:
      - "127.0.0.1:${SPOKE_APP_PORT:-8096}:80"
    depends_on:
      - gateway
    restart: unless-stopped

  consumer-portal:
    build: ../apps/consumer-portal
    container_name: consmat-v1-consumer-portal
    ports:
      - "127.0.0.1:${CONSUMER_PORTAL_PORT:-8097}:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
